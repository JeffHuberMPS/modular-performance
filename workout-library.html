<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPS — Exercise Library</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--mps-accent:#4ab3f4;--mps-accent-rgb:74,179,244;--text:#eef2f6;--text-dim:#9aa6b2;--text-faint:#5f6a76;--border:#232a33;--bg:#0a0c0f;--disp:'Oswald',sans-serif;--body:'Inter',system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(760px 420px at 8% -10%,rgba(var(--mps-accent-rgb),.08),transparent 60%);}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px;}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .top .bar{width:4px;height:30px;border-radius:3px;background:var(--mps-accent);box-shadow:0 0 16px rgba(var(--mps-accent-rgb),.5);}
  h1{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:.5px;}
  .controls{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent);padding-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="bar"></span><h1>Exercise Library</h1></div>
  <div id="mps-library-root"></div>
</div>
<script src="workout-library-data.js"></script>
<script src="workout-library.js"></script>
<script>MPSLibrary.mount('mps-library-root');</script>
</body>
</html>
